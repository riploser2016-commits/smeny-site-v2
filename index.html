<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои смены</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Смены">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--bg:#e4e8ef;--t1:#f7f9fc;--t2:#dfe4ec;--sd:#bcc3cf;--sl:#ffffff;--tx:#18202b;--mut:#707c8c;--a1:#4a8bff;--a2:#27c4f5;--ag:rgba(60,140,255,.45);--f1:#ffffff;--f2:#e6eaf1;--bn:#d9730d;--in:#d6dce6;--pill:rgba(255,255,255,.28);--ed:#bcc4d1;--ae:#2a5fcf;--ins:rgba(40,55,80,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--t1:#1e232b;--t2:#15181e;--sd:#06070a;--sl:#242a33;--tx:#e9edf3;--mut:#7c8796;--a1:#3b7bff;--a2:#1fb6f2;--ag:rgba(50,130,255,.4);--f1:#252b35;--f2:#171a20;--bn:#f2a85c;--in:#0d0f13;--pill:rgba(255,255,255,.22);--ed:#07080b;--ae:#1d3f91;--ins:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--t1:#1e232b;--t2:#15181e;--sd:#06070a;--sl:#242a33;--tx:#e9edf3;--mut:#7c8796;--a1:#3b7bff;--a2:#1fb6f2;--ag:rgba(50,130,255,.4);--f1:#252b35;--f2:#171a20;--bn:#f2a85c;--in:#0d0f13;--pill:rgba(255,255,255,.22);--ed:#07080b;--ae:#1d3f91;--ins:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
header h1{flex:1;margin:0;font-size:21px;font-weight:800;text-align:center;letter-spacing:-.2px}
.ib{width:42px;height:42px;border-radius:14px;font-size:22px;color:var(--mut);background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 3px 0 var(--ed),inset 0 1px 0 var(--sl);transition:transform .06s,box-shadow .06s}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ed),inset 0 1px 0 var(--sl)}
.wd,#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 14px}
.wd span{text-align:center;font-size:11px;color:var(--mut);font-weight:800;padding:4px 0;text-transform:uppercase;letter-spacing:.5px}
#grid{flex:1;grid-auto-rows:1fr;min-height:0;padding-bottom:12px;padding-top:2px}
.c{position:relative;border-radius:14px;background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 3px 0 var(--ed),inset 0 1px 0 var(--sl);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;min-height:0;transition:transform .06s,box-shadow .06s}
.c:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ed)}
.c.e{background:none;box-shadow:none}
.c.s{background:linear-gradient(145deg,var(--a1),var(--a2));color:#fff;box-shadow:0 3px 0 var(--ae),inset 0 1px 0 rgba(255,255,255,.35)}
.c.s:active{box-shadow:0 1px 0 var(--ae)}
.c.t::before{content:"";position:absolute;inset:-3px;border-radius:17px;border:2px solid var(--tx);opacity:.85;pointer-events:none}
.c small{position:absolute;bottom:3px;font-size:9.5px;font-weight:800;color:var(--bn);padding:0 5px;border-radius:6px}
.c.s small{color:#fff;background:var(--pill)}
footer{background:linear-gradient(165deg,var(--f1),var(--f2));border-radius:28px 28px 0 0;padding:16px 16px 14px;border-top:1px solid var(--sl)}
.big{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.big span{font-size:13px;font-weight:700;color:var(--mut);line-height:1.25}
.big b{font-size:32px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.two div{border-radius:16px;padding:10px 12px;background:var(--in);box-shadow:inset 0 2px 5px var(--ins)}
.two em{display:block;font-style:normal;font-size:12px;font-weight:800;color:var(--mut)}
.two b{display:block;font-size:20px;font-weight:800;margin:1px 0}
.two span{display:block;font-size:11px;color:var(--mut);font-weight:600}
.note{margin:10px 4px 0;font-size:11.5px;color:var(--mut);font-weight:600;line-height:1.5}
.note b{color:var(--tx)}
#ov{position:fixed;inset:0;background:rgba(5,8,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#ov[hidden]{display:none}
#sheet{width:100%;max-width:520px;background:linear-gradient(165deg,var(--f1),var(--f2));border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;border-top:1px solid var(--sl)}
#sheet h2{margin:0 0 14px;font-size:19px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.seg button,.btn{padding:13px;border-radius:14px;font-weight:800;background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 3px 0 var(--ed),inset 0 1px 0 var(--sl);transition:transform .06s}
.seg button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ed)}
.seg button.on,.btn.pri{background:linear-gradient(145deg,var(--a1),var(--a2));color:#fff;box-shadow:0 3px 0 var(--ae),inset 0 1px 0 rgba(255,255,255,.35)}
.seg button.on:active,.btn.pri:active{box-shadow:0 1px 0 var(--ae)}
label{display:block;font-size:13px;color:var(--mut);font-weight:700;margin-bottom:12px}
input,textarea{display:block;width:100%;margin-top:5px;padding:12px 13px;border-radius:14px;border:0;background:var(--in);color:var(--tx);font:inherit;font-size:16px;font-weight:700;box-shadow:inset 0 2px 5px var(--ins);outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
textarea{height:70px;font-size:12px;font-weight:600}
.hint{font-size:12px;color:var(--mut);margin:0 0 12px;line-height:1.5;font-weight:600}
h3{margin:6px 0 8px;font-size:14px;font-weight:800}
</style>
</head>
<body>
<div id="app">
<header><button class="ib" id="prev" aria-label="Предыдущий месяц">‹</button><h1 id="ttl"></h1><button class="ib" id="next" aria-label="Следующий месяц">›</button><button class="ib" id="gear" aria-label="Настройки">⚙</button></header>
<div class="wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
<div id="grid"></div>
<footer id="foot"></footer>
</div>
<div id="ov" hidden><div id="sheet"></div></div>
<script>
var MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MP=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
var MS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var WD=["вс","пн","вт","ср","чт","пт","сб"];
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,"0")};
var now=new Date(),Y=now.getFullYear(),M=now.getMonth();
var S={rate:0,work:4,off:2,anchor:Y+"-"+pad(M+1)+"-"+pad(now.getDate()),sp:15,pa:30,pb:15,init:0},D={};
try{var r=localStorage.getItem("shifts_v1");if(r){var o=JSON.parse(r);S=Object.assign(S,o.S||{});D=o.D||{}}}catch(e){}
function save(){try{localStorage.setItem("shifts_v1",JSON.stringify({S:S,D:D}))}catch(e){}}
function tap(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function ld(y,m){return new Date(y,m+1,0).getDate()}
function sched(y,m,d){var a=S.anchor.split("-").map(Number);var diff=Math.round((Date.UTC(y,m,d)-Date.UTC(a[0],a[1]-1,a[2]))/864e5);var c=S.work+S.off;return c>0&&(((diff%c)+c)%c)<S.work}
function isShift(y,m,d){var o=D[key(y,m,d)];return o&&o.s!==undefined?!!o.s:sched(y,m,d)}
function bonus(y,m,d){var o=D[key(y,m,d)];return o&&+o.b||0}
function money(n){return Math.round(n).toLocaleString("ru-RU")+" ₽"}
function sumR(y,m,a,b){var t=0,n=Math.min(b,ld(y,m));for(var d=a;d<=n;d++)if(isShift(y,m,d))t+=(+S.rate||0)+bonus(y,m,d);return t}
function cnt(y,m){var k=0,n=ld(y,m);for(var d=1;d<=n;d++)if(isShift(y,m,d))k++;return k}
function render(){
$("#ttl").textContent=MN[M]+" "+Y;
var first=(new Date(Y,M,1).getDay()+6)%7,n=ld(Y,M),h="";
for(var i=0;i<first;i++)h+='<div class="c e"></div>';
for(var d=1;d<=n;d++){var s=isShift(Y,M,d),b=bonus(Y,M,d),td=(Y==now.getFullYear()&&M==now.getMonth()&&d==now.getDate());
h+='<button class="c'+(s?" s":"")+(td?" t":"")+'" data-d="'+d+'">'+d+(s&&b?"<small>+"+b+"</small>":"")+"</button>"}
$("#grid").innerHTML=h;
var sp=Math.min(Math.max(+S.sp||15,1),27),py=M?Y:Y-1,pm=M?M-1:11,pn=ld(py,pm),ny=M<11?Y:Y+1,nm=(M+1)%12;
var A=sumR(py,pm,sp+1,pn),B=sumR(Y,M,1,sp),C=sumR(Y,M,sp+1,n);
var cards=[{day:Math.min(+S.pb||15,n),v:A,cap:"смены "+(sp+1)+"–"+pn+" "+MS[pm]},{day:Math.min(+S.pa||30,n),v:B,cap:"смены 1–"+sp+" "+MS[M]}].sort(function(a,b){return a.day-b.day});
var nd=Math.min(+S.pb||15,ld(ny,nm));
$("#foot").innerHTML='<div class="big"><span>Придёт<br>в '+MP[M]+'</span><b>'+money(A+B)+'</b></div>'+
'<div class="two">'+cards.map(function(c){return"<div><em>"+c.day+" "+MG[M]+"</em><b>"+money(c.v)+"</b><span>"+c.cap+"</span></div>"}).join("")+"</div>"+
'<p class="note">Заработано по сменам за месяц: <b>'+money(B+C)+'</b> · смен: '+cnt(Y,M)+'<br>Смены '+(sp+1)+'–'+n+' '+MS[M]+' (<b>'+money(C)+'</b>) придут '+nd+' '+MG[nm]+'</p>'}
function open(html){$("#sheet").innerHTML=html;$("#ov").hidden=false}
function close(){$("#ov").hidden=true;save();render()}
function daySheet(d){
tap();var k=key(Y,M,d),dt=new Date(Y,M,d),s=isShift(Y,M,d);
open('<h2>'+d+' '+MG[M]+', '+WD[dt.getDay()]+'</h2><div class="seg"><button data-s="1" class="'+(s?"on":"")+'">Смена</button><button data-s="0" class="'+(s?"":"on")+'">Выходной</button></div>'+
'<label>Бонус за эту смену, ₽<input id="bn" type="number" inputmode="decimal" value="'+(bonus(Y,M,d)||"")+'" placeholder="0"></label>'+
'<div class="row"><button class="btn" id="rs">Как в графике</button><button class="btn pri" id="ok">Готово</button></div>');
var segs=document.querySelectorAll(".seg button");
segs.forEach(function(b){b.onclick=function(){tap();D[k]=D[k]||{};D[k].s=+b.dataset.s;segs.forEach(function(x){x.classList.toggle("on",x==b)})}});
$("#bn").oninput=function(){D[k]=D[k]||{};D[k].b=+this.value||0};
$("#rs").onclick=function(){delete D[k];close()};
$("#ok").onclick=close}
function setSheet(){
open('<h2>Настройки</h2><label>Оплата за смену, ₽<input id="f-rate" type="number" inputmode="decimal" value="'+(S.rate||"")+'" placeholder="Например, 3000"></label>'+
'<div class="g2"><label>Дней работы<input id="f-work" type="number" inputmode="numeric" value="'+S.work+'"></label><label>Дней отдыха<input id="f-off" type="number" inputmode="numeric" value="'+S.off+'"></label></div>'+
'<label>Первый рабочий день цикла<input id="f-anchor" type="date" value="'+S.anchor+'"></label>'+
'<h3>Выплаты</h3><div class="g3"><label>Полмесяца до<input id="f-sp" type="number" inputmode="numeric" value="'+S.sp+'"></label><label>Платят в этом месяце<input id="f-pa" type="number" inputmode="numeric" value="'+S.pa+'"></label><label>Платят в след. месяце<input id="f-pb" type="number" inputmode="numeric" value="'+S.pb+'"></label></div>'+
'<p class="hint">Сейчас: смены 1–'+S.sp+' оплачивают '+S.pa+'-го числа того же месяца, а остальные смены месяца — '+S.pb+'-го числа следующего.</p>'+
'<label>Резервная копия: скопируйте текст и сохраните в заметки, чтобы не потерять данные<textarea id="bk">'+JSON.stringify({S:S,D:D}).replace(/</g,"\\u003c")+'</textarea></label>'+
'<div class="row"><button class="btn" id="ld">Загрузить из поля</button><button class="btn pri" id="ok">Готово</button></div>');
["rate","work","off","sp","pa","pb"].forEach(function(p){$("#f-"+p).oninput=function(){S[p]=+this.value||0}});
$("#f-anchor").onchange=function(){if(this.value)S.anchor=this.value};
$("#ld").onclick=function(){try{var o=JSON.parse($("#bk").value);S=Object.assign(S,o.S);D=o.D||{};close()}catch(e){alert("Не удалось прочитать данные. Проверьте, что скопирован весь текст.")}};
$("#ok").onclick=close}
$("#grid").onclick=function(e){var b=e.target.closest("[data-d]");if(b)daySheet(+b.dataset.d)};
$("#prev").onclick=function(){tap();M--;if(M<0){M=11;Y--}render()};
$("#next").onclick=function(){tap();M++;if(M>11){M=0;Y++}render()};
$("#gear").onclick=setSheet;
$("#ov").onclick=function(e){if(e.target.id=="ov")close()};
render();
if(!S.init){S.init=1;save();setSheet()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
